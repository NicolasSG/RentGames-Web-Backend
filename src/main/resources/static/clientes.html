<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - RentGames</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteudo</a>

  <div class="app-shell">
    <div class="nav-scrim"></div>
    <aside class="sidebar">
      <div class="sidebar__brand"><span class="sidebar__brand-logo" aria-hidden="true">RG</span> RentGames</div>
      <nav class="sidebar__nav" aria-label="Menu principal">
        <a class="sidebar__link" href="dashboard.html"><span class="sidebar__link-icon">🏠</span> Inicio</a>
        <a class="sidebar__link" href="jogos.html"><span class="sidebar__link-icon">🎮</span> Jogos</a>
        <a class="sidebar__link" href="clientes.html" aria-current="page"><span class="sidebar__link-icon">👤</span> Clientes</a>
        <a class="sidebar__link" href="alugueis.html"><span class="sidebar__link-icon">📦</span> Alugueis</a>
        <a class="sidebar__link" href="caixa.html"><span class="sidebar__link-icon">💰</span> Caixa</a>
        <span data-somente-admin><a class="sidebar__link" href="usuarios.html"><span class="sidebar__link-icon">⚙️</span> Usuarios</a></span>
      </nav>
      <div class="sidebar__footer">
        <button type="button" class="btn btn-block" data-logout>Sair</button>
      </div>
    </aside>

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" class="nav-toggle" data-nav-toggle aria-label="Abrir menu">☰</button>
        <span class="topbar__title">Clientes</span>
      </div>
      <div class="topbar__user">
        <span class="topbar__badge" data-usuario-nivel></span>
        <span data-usuario-nome></span>
      </div>
    </header>

    <main class="main" id="conteudo-principal">
      <div class="page-header">
        <div>
          <h1>Clientes</h1>
          <p class="page-header__subtitle text-muted">Cadastro de locatarios da locadora</p>
        </div>
      </div>

      <section class="section">
        <h2 class="section__title">Cadastrar cliente</h2>
        <form id="form-cliente" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="nomeCompleto">Nome *</label>
              <input type="text" id="nomeCompleto" name="nomeCompleto" required aria-describedby="nomeCompleto-erro">
              <span class="form-error" id="nomeCompleto-erro"></span>
            </div>
            <div class="form-field">
              <label for="contato">Contato *</label>
              <input type="text" id="contato" name="contato" placeholder="(11) 99999-0000" required aria-describedby="contato-erro">
              <span class="form-error" id="contato-erro"></span>
            </div>
            <div class="form-field">
              <label for="cpf">CPF (opcional)</label>
              <input type="text" id="cpf" name="cpf" aria-describedby="cpf-erro">
              <span class="form-error" id="cpf-erro"></span>
            </div>
            <div class="form-field">
              <label for="endereco">Endereco *</label>
              <input type="text" id="endereco" name="endereco" required aria-describedby="endereco-erro">
              <span class="form-error" id="endereco-erro"></span>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
          </div>
        </form>
      </section>

      <section class="section">
        <div class="table-toolbar">
          <h2 class="section__title" style="margin-bottom:0;">Clientes cadastrados</h2>
          <input type="search" id="clientes-busca" placeholder="Buscar por nome, contato ou CPF..." style="max-width:260px; padding:8px 12px; border-radius:6px; border:1px solid var(--color-border);">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Nome</th><th>Contato</th><th>CPF</th><th>Endereco</th><th></th></tr>
            </thead>
            <tbody id="clientes-tbody"></tbody>
          </table>
          <p class="table-empty" id="clientes-vazio">Nenhum cliente encontrado.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
