<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - RentGames</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-brand__logo" aria-hidden="true">RG</span>
      </div>
      <h1 class="auth-title">Criar conta</h1>
      <p class="auth-subtitle text-muted">Leva menos de um minuto</p>

      <div class="alert alert-danger" id="cadastro-alerta" role="alert" hidden></div>

      <form id="form-cadastro" novalidate>
        <div class="form-field" style="margin-bottom: 16px;">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required aria-describedby="email-erro">
          <span class="form-error" id="email-erro"></span>
        </div>

        <div class="form-field" style="margin-bottom: 16px;">
          <label for="senha">Senha</label>
          <div class="password-field">
            <input type="password" id="senha" name="senha" autocomplete="new-password" required aria-describedby="senha-erro">
            <button type="button" class="password-toggle" data-target="senha" aria-pressed="false">Mostrar</button>
          </div>
          <span class="hint">Minimo de 6 caracteres.</span>
          <span class="form-error" id="senha-erro"></span>
        </div>

        <div class="form-field">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password" required aria-describedby="confirmarSenha-erro">
          <span class="form-error" id="confirmarSenha-erro"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Registrar</button>
      </form>

      <p class="auth-footer">Ja tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>RentGames.Auth.iniciarCadastro();</script>
</body>
</html>
